{{- range $index, $gateway := .Values.gateways }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  generation: 1
  name: {{ $gateway.name | default (printf "%s-gateway-%d" $.Release.Name $index) }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with $gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    istio: {{ $.Values.istioGateway.name | default $.Release.Name }}
  servers:
  {{- toYaml $gateway.servers | nindent 2 }}
{{- end }}
