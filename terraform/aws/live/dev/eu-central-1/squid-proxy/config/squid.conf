# Basic Squid Configuration with ACLs - HTTP/HTTPS Only
http_port 3128

# Define allowed ports
acl SSL_ports port 1-65535
acl Safe_ports port 1-65535
acl CONNECT method CONNECT

# Only allow cachemgr access from localhost
http_access allow localhost manager
http_access deny manager

# Define ACLs for allowed and denied domains
acl allowed_sites dstdomain "/etc/squid/squid.allowed.sites.txt"
acl denied_sites dstdomain "/etc/squid/domain_blacklist.txt"

#Define allowed client IPs
acl allowed_ips src "/etc/squid/allowed_ips.txt"

# Default denied message
deny_info ERR_ACCESS_DENIED denied_sites

# CRITICAL: Access control rules in correct order
# 1. First deny unsafe ports
#http_access deny !Safe_ports

# 2. Deny CONNECT to non-SSL ports
#http_access deny CONNECT !SSL_ports

# Access control rules
http_access deny denied_sites
http_access allow allowed_ips
http_access allow allowed_sites
http_access deny all

# Disable caching
cache deny all
cache_dir null /tmp
cache_mem 0 MB

# Always validate content with origin server
reload_into_ims on
maximum_object_size 0 KB
minimum_object_size 0 KB
negative_ttl 0 seconds
positive_dns_ttl 0 seconds
negative_dns_ttl 0 seconds

# Logging
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Set timeout values
connect_timeout 1 minute
read_timeout 5 minutes
request_timeout 5 minutes
