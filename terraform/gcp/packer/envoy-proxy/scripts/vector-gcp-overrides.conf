[Service]
# The package unit's ExecStartPre/ExecStart pass no config path at all, so
# Vector falls back to its own built-in default
# (/etc/vector/vector.yaml on this package build) instead of our
# /etc/vector/vector.toml - confirmed via a live failure: "Config file not
# found in path. path=/etc/vector/vector.yaml", 2026-08-20. Clear the
# inherited exec lines (the "=" reset syntax) and restate them pointed at
# the real path. This is a fixed, image-level fact about how this Vector
# package build behaves - not environment-specific - so it stays baked into
# the image, unlike the config-bucket pull/EnvironmentFile wiring (moved to
# the live-layer startup-script, see templates/startup-script.sh in the
# consuming live-layer unit).
#
# NOTE the asymmetry, confirmed live: `vector validate` takes the config
# path as a bare positional argument ("unexpected argument '--config'
# found" if you pass it as a flag - --config-toml/--config-yaml/
# --config-json exist instead, for explicit-format validation only), while
# running vector itself (ExecStart) uses -c/--config normally. Do not
# "fix" this asymmetry to look consistent - it is not a typo.
ExecStartPre=
ExecStartPre=/usr/bin/vector validate /etc/vector/vector.toml
ExecStart=
ExecStart=/usr/bin/vector --config /etc/vector/vector.toml
