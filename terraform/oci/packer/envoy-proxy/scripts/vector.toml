# Ported from terraform/gcp/packer/envoy-proxy/scripts/vector.toml, which is
# itself an adaptation of terraform/catalog/units/envoy-proxy/config/vector.toml
# (the AWS Envoy fleet's canonical Vector config, hyperswitch-infra).
#
# THE FILE IS BYTE-IDENTICAL TO THE GCP ONE BELOW THIS HEADER, and that is the
# finding rather than laziness: every transform in it - the log shaping, the
# payment-path masking, the log_to_metric rollups, the prometheus_exporter sink
# - operates on Envoy's access-log JSON and on host metrics. None of it touches
# a cloud API. vm-tier-and-images.md section 4 predicted exactly this ("the
# provisioner scripts themselves port with NO OS-level logic changes - only the
# config-fetch mechanism at the very end changes") and this file is the clearest
# single piece of evidence for it.
#
# Dropped by the GCP port and still absent here - no OCI equivalent either:
#   - sinks.sink_elasticsearch: pointed at a VPC-private AWS OpenSearch
#     endpoint with auth.strategy = "aws" (SigV4). No OpenSearch is deployed on
#     OCI; `opensearch` is an unported module and, per
#     vm-tier-and-images.md section 1, a managed-service parity question rather
#     than a VM-tier one.
#   - sinks.cloudwatch_metrics (+ its feeder transforms
#     system_memory_metric/update_namespace): "aws_cloudwatch_metrics" is an
#     AWS-only Vector sink type. OCI's Monitoring service has no Vector sink at
#     all, so this is a genuine gap, not a rename.
#
# Commented out, not deleted - and on OCI the reason is stronger than it was on
# GCP:
#   - sinks.sink_loki. On GCP the endpoint was merely unconfirmed. On OCI it is
#     confirmed absent: `loki` is a phase-3 application unit and the OCI dev
#     stack's phase 3 currently contains exactly one unit
#     (oke-workload-identity). There is nothing to point it at yet.
#
# get_env_var("METADATA_*") calls are populated by
# ../../shared/scripts/populate-oci-metadata.sh via oci-metadata.service. Note
# the divergence recorded in that script's header: GCP moved this population
# out of the image into a live-layer startup-script, and OCI cannot, because
# the OCI composition module has no startup-script seam. METADATA_ASG_NAME is
# also a weaker signal here than on either other cloud - OCI exposes no
# pool-membership field in IMDS, so it carries the instance display name the
# pool stamped on the instance rather than a pool identifier.

[sources.envoy_logs]
  type = "file"
  include = [ "/var/log/envoy/listener-https*.log" ]
  read_from = "end"
  max_read_bytes = 10485760  # 10 MB max read per file
  max_line_bytes = 102400     # 100 KB max line size

[api]
  enabled = true

[sources.vector_internal]
  type = "internal_metrics"
  namespace = "vector"

[sources.systems_metrics]
type = "host_metrics"
collectors = [
  "cpu",
  "disk",
  "filesystem",
  "load",
  "host",
  "memory",
  "network"
]
namespace = "envoy"
scrape_interval_secs = 10

[transforms.systems_metrics_with_metadata]
type = "remap"
inputs = [ "systems_metrics" ]
source = """
  .tags.ltversion = get_env_var("METADATA_LT_VERSION") ?? "unknown"
"""


[sources.envoy_prom_metrics]
type = "prometheus_scrape"
endpoints = [ "http://localhost:9901/stats/prometheus" ]
scrape_interval_secs = 10

[transforms.envoy_prom_metrics_with_metadata]
type = "remap"
inputs = [ "envoy_prom_metrics" ]
source = """
  .tags.ltversion = get_env_var("METADATA_LT_VERSION") ?? "unknown"
"""

[transforms.envoy_logs_with_metadata]
type = "remap"
inputs = [ "envoy_logs" ]
source = """
  .asg_name = get_env_var("METADATA_ASG_NAME") ?? "unknown"
  .instance_id = get_env_var("METADATA_INSTANCE_ID") ?? "unknown"
  .instance_ip = get_env_var("METADATA_INSTANCE_IP") ?? "unknown"
  .ltversion = get_env_var("METADATA_LT_VERSION") ?? "unknown"
"""

[transforms.envoy_logs_json]
type = "remap"
inputs = [ "envoy_logs_with_metadata" ]
source = """
  # Parse JSON with error handling
  parsed_message, err = parse_json(.message)
  if err == null {
    . = merge(., parsed_message) ?? .
  }
  # separating query string from path
  .|= parse_regex!(.path, r'^(?P<path>[^\\\\?]*)(\\\\?(?P<query_string>.*?))?')

  # converting upstream_service_time to float
  .upstream_service_time, err = to_float(.upstream_service_time)
  if err != null{
      .upstream_service_time = 0.0
  }
  .upstream_service_time = .upstream_service_time / 1000

  # changing the default value from null to "-"
  if .x_payment_method_type == null{
      .x_payment_method_type = "-"
  }

  if .path == null{
      .path = "-"
  }

  if .x_merchant_id == null{
      .x_merchant_id = "-"
  }

  if .upstream_service_time == null{
      .upstream_service_time = 0
  }

  if .upstream_cluster == null{
      .upstream_cluster = "-"
  }

  .duration = to_float(.duration) / 1000
  del(.message)
  del(.query_string)
  del(.file)
"""

[transforms.modify_logs]
type = "remap"
inputs = [ "envoy_logs_json" ]
source = """
  # Replace patterns in the path

  .path = to_string(.path) ?? "default"

  .path = replace(.path, r'^/payments/(.*)/confirm', "/payments/:id/confirm")
  .path = replace(.path, r'^/payments/(.*)/confirm', "/payments/:id/confirm")
  .path = replace(.path, r'^/payments/(.*)/cancel', "/payments/:id/cancel")
  .path = replace(.path, r'^/payments/(.*)/capture', "/payments/:id/capture")
  .path = replace(.path, r'^/payments/(.*)/approve', "/payments/:id/approve")
  .path = replace(.path, r'^/payments/(.*)/reject', "/payments/:id/reject")
  .path = replace(.path, r'^/payments/(.*)/3ds/authentication', "/payments/:id/3ds/authentication")
  .path = replace(.path, r'^/payments/(.*)/(.*)/authorize/(.*)', "/payments/:id/$${2}/$${3}")
  .path = replace(.path, r'^/payments/(.*)/(.*)/redirect/response/(.*)/(.*)' , "/payments/:id/$${2}/redirect/response/$${3}/:cred_identifier")
  .path = replace(.path, r'^/payments/(.*)/(.*)/redirect/response/(.*)' , "/payments/:id/:mid/redirect/response/:gateway")

  .path = replace(.path, r'^/customers/(.*)/payment_methods', "/customers/:id/payment_methods")

  .path = replace(.path, r'^/payouts/(.*)/cancel', "/payouts/:id/cancel")
  .path = replace(.path, r'^/payouts/(.*)/fulfill', "/payouts/:id/fulfill")
  .path = replace(.path, r'^/payouts/(.*)', "/payments/:id")

  .path = replace(.path, r'^/mandates/(.*)', "/mandates/:id")
  .path = replace(.path, r'^/mandates/revoke/(.*)', "/mandates/revoke/:id")

  .path = replace(.path, r'^/api_keys/(.*)', "/api_keys/:id")
  .path = replace(.path, r'^/api_keys/(.*)/list', "/api_keys/:id/list")
  .path = replace(.path, r'^/api_keys/(.*)/(.*)', "/api_keys/:mid/:keyid")

  .path = replace(.path, r'^/disputes/accept/(.*)', "/disputes/accept/:id")
  .path = replace(.path, r'^/disputes/evidence/(.*)', "/disputes/evidence/:id")
  .path = replace(.path, r'^/disputes/(.*)', "/disputes/:id")

  .path = replace(.path, r'^/cards/(.*)', "/cards/:bin")

  .path = replace(.path, r'^/payment_link/(.*)', "/payment_link/:link_id")
  .path = replace(.path, r'^/payment_link/(.*)/(.*)', "/payment_link/:mid/:pid")

  .path = replace(.path, r'^/account/(.*)/business_profile', "/account/:id/business_profile")


  # del(.message)
  del(.query_string)
  del(.protocol)
  del(.x_forwarded_for)
  del(.user_agent)
  del(.request_id)
  del(.authority)
  del(.upstream_host)
  del(.content_type)"""

[transforms.metrics]
type = "log_to_metric"
inputs = [ "modify_logs" ]

  [[transforms.metrics.metrics]]
  type = "counter"
  field = "path"
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ .path }}"
    response_code = "{{ .response_code }}"
#    merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

  [[transforms.metrics.metrics]]
  type = "histogram"
  field = "duration"
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ path }}"
    response_code = "{{ .response_code }}"
 #   merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

  [[transforms.metrics.metrics]]
  type = "gauge"
  field = "bytes_sent"
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ .path }}"
    response_code = "{{ .response_code }}"
  #  merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

  [[transforms.metrics.metrics]]
  type = "gauge"
  field = "bytes_received"
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ .path }}"
    response_code = "{{ .response_code }}"
   # merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

  [[transforms.metrics.metrics]]
  type = "histogram"
  field = "upstream_service_time"
  default = 0
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ .path }}"
    response_code = "{{ .response_code }}"
    #merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

  [[transforms.metrics.metrics]]
  type = "counter"
  field = "x_payment_method_type"
  namespace = "envoy"

    [transforms.metrics.metrics.tags]
    path = "{{ .path }}"
    response_code = "{{ .response_code }}"
   # merchant_id = "{{ .x_merchant_id }}"
    upstream_cluster = "{{ .upstream_cluster }}"
    request_method = "{{ .request_method }}"
    response_flags = "{{ .response_flags }}"
    ltversion = "{{ .ltversion }}"

[sinks.prom]
type = "prometheus_exporter"
inputs = [
  "metrics",
  "systems_metrics_with_metadata",
  "envoy_prom_metrics_with_metadata",
  "vector_internal"
]
buckets = [
  0.01,
  0.05,
  0.1,
  0.25,
  0.5,
  1,
  2.5,
  5,
  10,
  30,
  60,
  120,
  220,
  300
]
address = "0.0.0.0:9273"
flush_period_secs = 10

