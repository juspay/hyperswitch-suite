# =============================================================================
# Systemd drop-in for squid.service - run Squid as non-root (control 13c).
# =============================================================================
# Ubuntu's squid package runs with no explicit User=/Group= override, so the
# master process defaults to root (the worker processes already drop to the
# `proxy` user/group that the package ships in its own unit). Hardening
# procedure section 13c requires Squid not run as root at all.
#
# Setting User=proxy / Group=proxy makes the master process run as `proxy`,
# matching the workers. RuntimeDirectory=squid creates /run/squid owned
# proxy:proxy at service start (systemd's transient-directory machinery, mode
# from RuntimeDirectoryMode), which is where squash's pid_filename
# (/run/squid/squid.pid) and any runtime sockets live.
#
# /var/log/squid and /var/spool/squid are made writable by the build (chown
# proxy:proxy) so the service can write its logs and swap dir as proxy.
#
# Installed by the Packer build to
# /etc/systemd/system/squid.service.d/hardening.conf.
# =============================================================================
[Service]
User=proxy
Group=proxy
RuntimeDirectory=squid
RuntimeDirectoryMode=0750