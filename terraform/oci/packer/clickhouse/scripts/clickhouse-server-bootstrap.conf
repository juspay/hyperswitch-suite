# Installed as /etc/systemd/system/clickhouse-server.service.d/bootstrap.conf.
#
# The fail-closed gate. The deb's clickhouse-server.service is kept exactly as
# shipped (plan W2 step 5: "keep the deb's clickhouse-server.service"); this
# drop-in only adds the dependency edge that makes the contract hold:
#
#   Requires=clickhouse-bootstrap.service
#
# Starting clickhouse-server now pulls in the bootstrap (ordered first by the
# unit's Before=), and if the bootstrap fails - no user_data, bad JSON, missing
# data volume - the server's start is dropped and the service stays stopped.
# Without this edge a failed bootstrap is merely an ordering hint and the
# server would come up anyway on its shipped defaults, silently running on the
# root disk. That is exactly the failure mode section 4 of the plan refuses.
#
# Within one boot, RemainAfterExit=yes on the bootstrap keeps it "active"
# after success, so plain restarts of the server do not re-run it (the script
# is idempotent anyway).
[Unit]
Requires=clickhouse-bootstrap.service
