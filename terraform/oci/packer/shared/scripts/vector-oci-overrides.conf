[Service]
# Two fixes, both image-level facts about how this Vector .deb behaves rather
# than anything environment-specific, which is why they stay baked in.
#
# 1. CONFIG PATH. The package unit's ExecStartPre/ExecStart pass no config path
#    at all, so Vector falls back to its own built-in default
#    (/etc/vector/vector.yaml on this package build) instead of our
#    /etc/vector/vector.toml. Confirmed on the GCP side by a live failure:
#    "Config file not found in path. path=/etc/vector/vector.yaml", 2026-08-20.
#    Clear the inherited exec lines (the "=" reset syntax) and restate them
#    pointed at the real path.
#
#    NOTE the asymmetry, and do NOT "fix" it to look consistent - it is not a
#    typo: `vector validate` takes the config path as a bare POSITIONAL
#    argument ("unexpected argument '--config' found" if passed as a flag;
#    --config-toml/--config-yaml/--config-json exist instead, for
#    explicit-format validation only), while running vector itself (ExecStart)
#    uses -c/--config normally.
#
# 2. METADATA. vector.toml's get_env_var("METADATA_*") calls need
#    /etc/default/metadata to be in the unit's environment. On AWS that file is
#    written by userdata; on GCP by a live-layer startup-script; on OCI by
#    oci-metadata.service, because the OCI composition module has no
#    startup-script seam (see populate-oci-metadata.sh's header for the full
#    reasoning). The leading "-" makes a missing file non-fatal, so an image
#    booted standalone still starts Vector - it just tags everything "unknown".
ExecStartPre=
ExecStartPre=/usr/bin/vector validate /etc/vector/vector.toml
ExecStart=
ExecStart=/usr/bin/vector --config /etc/vector/vector.toml
EnvironmentFile=-/etc/default/metadata
