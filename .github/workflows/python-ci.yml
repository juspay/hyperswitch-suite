name: Python CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'load-test/**'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-lint:
    name: Ruff Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: load-test/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r load-test/requirements.txt

      - name: Run Ruff linter
        id: ruff-lint
        run: |
          ruff check load-test/ --output-format=github

      - name: Run Ruff format check
        id: ruff-format
        run: |
          ruff format load-test/ --check --diff

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: load-test/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r load-test/requirements.txt

      - name: Run pytest
        id: pytest
        run: |
          cd load-test
          python -m pytest -v --tb=short 2>&1

  pip-audit:
    name: Pip Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: load-test/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r load-test/requirements.txt

      - name: Run pip-audit
        id: pip-audit
        run: |
          pip-audit -r load-test/requirements.txt --desc

  python-ci-summary:
    name: Python CI Summary
    runs-on: ubuntu-latest
    needs: [ruff-lint, pytest, pip-audit]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Python CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          RUFF_RESULT="${{ needs.ruff-lint.result }}"
          PYTEST_RESULT="${{ needs.pytest.result }}"
          PIP_AUDIT_RESULT="${{ needs.pip-audit.result }}"

          if [ "$RUFF_RESULT" == "success" ]; then
            echo "| Ruff Lint & Format | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$RUFF_RESULT" == "skipped" ]; then
            echo "| Ruff Lint & Format | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Ruff Lint & Format | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PYTEST_RESULT" == "success" ]; then
            echo "| Pytest | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PYTEST_RESULT" == "skipped" ]; then
            echo "| Pytest | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Pytest | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PIP_AUDIT_RESULT" == "success" ]; then
            echo "| Pip Audit | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$PIP_AUDIT_RESULT" == "skipped" ]; then
            echo "| Pip Audit | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Pip Audit | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check required results
        run: |
          RUFF_RESULT="${{ needs.ruff-lint.result }}"
          PYTEST_RESULT="${{ needs.pytest.result }}"
          PIP_AUDIT_RESULT="${{ needs.pip-audit.result }}"

          FAILED="false"

          if [ "$RUFF_RESULT" != "success" ]; then
            echo "::error::Ruff lint/format check failed or was skipped"
            FAILED="true"
          fi

          if [ "$PYTEST_RESULT" != "success" ]; then
            echo "::error::Pytest failed or was skipped"
            FAILED="true"
          fi

          if [ "$PIP_AUDIT_RESULT" != "success" ]; then
            echo "::error::Pip audit failed or was skipped"
            FAILED="true"
          fi

          if [ "$FAILED" == "true" ]; then
            exit 1
          fi

          echo "All Python CI checks passed!"
