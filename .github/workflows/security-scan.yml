name: Security Scan

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.github/workflows/security-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.github/workflows/security-scan.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'mock' }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'mock' }}
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      terraform-dirs: ${{ steps.changed.outputs.terraform_dirs }}
      has-changes: ${{ steps.changed.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed terraform files
        id: changed
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1...HEAD -- 'terraform/**/*.tf' 'terraform/**/*.tfvars' | grep -v '.terraform' || true)
          else
            git fetch origin ${{ github.base_ref }}
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'terraform/**/*.tf' 'terraform/**/*.tfvars' | grep -v '.terraform' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "terraform_dirs=[]" >> $GITHUB_OUTPUT
            echo "No terraform files changed"
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          TF_DIRS=$(echo "$CHANGED_FILES" | xargs -I{} dirname {} | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "terraform_dirs=$TF_DIRS" >> $GITHUB_OUTPUT

          echo "Changed terraform files:"
          echo "$CHANGED_FILES"
          echo ""
          echo "Affected directories:"
          echo "$TF_DIRS" | jq -r '.[]'

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Checkov on changed directories
        uses: bridgecrewio/checkov-action@master
        id: checkov
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          compact: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          skip_check: CKV_TF_1

      - name: Upload Checkov SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results.sarif
          retention-days: 5

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run tfsec on changed directories
        id: tfsec
        run: |
          EXIT_CODE=0
          PASSED_DIRS=""
          FAILED_DIRS=""

          DIRS='${{ needs.detect-changes.outputs.terraform-dirs }}'

          for dir in $(echo "$DIRS" | jq -r '.[]'); do
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              continue
            fi

            echo "=================================================="
            echo "Scanning: $dir"
            echo "=================================================="

            docker run --rm -v "$(pwd):/src" aquasec/tfsec /src/"$dir" --format compact --no-color 2>&1
            SCAN_EXIT=$?

            if [ $SCAN_EXIT -ne 0 ]; then
              echo "::error file=$dir::tfsec found security issues"
              FAILED_DIRS="${FAILED_DIRS}$dir\n"
              EXIT_CODE=1
            else
              echo "[PASS] No security issues in $dir"
              PASSED_DIRS="${PASSED_DIRS}$dir\n"
            fi

            echo ""
          done

          echo ""
          echo "=================================================="
          echo "TFSEC SUMMARY"
          echo "=================================================="
          echo ""
          echo "PASSED:"
          echo -e "$PASSED_DIRS" | grep -v "^$" || echo "None"
          echo ""
          echo "FAILED:"
          echo -e "$FAILED_DIRS" | grep -v "^$" || echo "None"

          exit $EXIT_CODE

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        id: trivy
        with:
          scan-type: fs
          scan-ref: terraform/
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 5

  security-scan-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, checkov, tfsec, trivy]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          HAS_CHANGES='${{ needs.detect-changes.outputs.has-changes }}'

          if [ "$HAS_CHANGES" != "true" ]; then
            echo "No terraform files changed in this PR." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          CHECKOV_RESULT="${{ needs.checkov.result }}"
          TFSEC_RESULT="${{ needs.tfsec.result }}"
          TRIVY_RESULT="${{ needs.trivy.result }}"

          if [ "$CHECKOV_RESULT" == "success" ]; then
            echo "| Checkov | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$CHECKOV_RESULT" == "skipped" ]; then
            echo "| Checkov | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Checkov | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TFSEC_RESULT" == "success" ]; then
            echo "| tfsec | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TFSEC_RESULT" == "skipped" ]; then
            echo "| tfsec | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| tfsec | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TRIVY_RESULT" == "success" ]; then
            echo "| Trivy | PASSED |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TRIVY_RESULT" == "skipped" ]; then
            echo "| Trivy | SKIPPED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Trivy | FAILED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check required results
        run: |
          HAS_CHANGES='${{ needs.detect-changes.outputs.has-changes }}'

          if [ "$HAS_CHANGES" != "true" ]; then
            echo "No terraform changes to scan"
            exit 0
          fi

          CHECKOV_RESULT="${{ needs.checkov.result }}"
          TFSEC_RESULT="${{ needs.tfsec.result }}"
          TRIVY_RESULT="${{ needs.trivy.result }}"

          FAILED="false"

          if [ "$CHECKOV_RESULT" != "success" ]; then
            echo "::error::Checkov scan failed or was skipped"
            FAILED="true"
          fi

          if [ "$TFSEC_RESULT" != "success" ]; then
            echo "::error::tfsec scan failed or was skipped"
            FAILED="true"
          fi

          if [ "$TRIVY_RESULT" != "success" ]; then
            echo "::error::Trivy scan failed or was skipped"
            FAILED="true"
          fi

          if [ "$FAILED" == "true" ]; then
            exit 1
          fi

          echo "All security scans passed!"
